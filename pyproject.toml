[project]
name = "kcorc-summer-school-2026"
version = "0.1.0"
description = "Open Source Modelling Workshop at KCORC Summer School 2026"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "coolprop>=8.0.0",
    "ctrefprop>=0.10.5",
    "deap>=1.4.4",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "scipy>=1.18.0",
    "tabulate>=0.10.0",
    "tespy>=0.11.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.2",
]
